<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Rate Card is Ready · RateRight</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #ceeee8 0%, #e8f6f3 40%, #f0f9f7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      color: #1c2b2a;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 52px 48px;
      box-shadow: 0 4px 32px rgba(26,143,127,0.1);
      max-width: 440px;
      width: 100%;
    }
    .icon { font-size: 3.5rem; margin-bottom: 20px; animation: pop 0.5s ease; }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    h1 { font-family: 'Nunito', sans-serif; font-size: 1.9rem; font-weight: 900; margin-bottom: 10px; color: #1c2b2a; }
    p { color: #7a9e99; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      background: #1a8f7f;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 36px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
      width: 100%;
    }
    .btn:hover { background: #136e61; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 0.78rem; color: #7a9e99; margin-top: 14px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Payment confirmed!</h1>
    <p>Generating your personalised rate card PDF now. This takes just a few seconds.</p>
    <button class="btn" id="download-btn" disabled>
      <span class="spinner"></span> Generating your PDF...
    </button>
    <p class="note">Your rate card will download automatically.</p>
  </div>

  <script>
    async function generateAndDownload() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) { document.getElementById('download-btn').textContent = 'Error: no session found'; return; }
      try {
        const res = await fetch('/api/generate-pdf?session_id=' + sessionId);
        if (!res.ok) throw new Error('Generation failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'my-rate-card.pdf'; a.click();
        const btn = document.getElementById('download-btn');
        btn.disabled = false;
        btn.innerHTML = '⬇️ Download Again';
        btn.onclick = () => a.click();
      } catch (err) {
        const btn = document.getElementById('download-btn');
        btn.disabled = false;
        btn.textContent = 'Retry Download';
        btn.onclick = generateAndDownload;
      }
    }
    generateAndDownload();
  </script>
</body>
</html>
